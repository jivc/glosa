# Construye los instaladores de Glosa para macOS, Windows y Linux (Fedora/RPM, Debian/Ubuntu y AppImage)
# y los publica como una «Release» de GitHub con las notas de CHANGELOG.md.
#
# Se ejecuta de dos formas (ver PUBLICAR.md):
#   1. Automática: al subir una etiqueta vX.Y.Z (lo hace `npm run publicar`).
#   2. Manual: pestaña «Actions» → «Instaladores» → «Run workflow». Usa la versión de package.json.
name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publicar:
        description: '¿Publicar la versión al terminar? (si no, sólo se construyen los instaladores para probarlos)'
        type: boolean
        default: true
      borrador:
        description: '¿Dejarla como borrador para revisarla antes de hacerla pública?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Herramientas para RPM
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Empaquetar
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: glosa-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.rpm
            release/*.deb
            release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión y notas
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node scripts/notas-version.mjs "$VERSION" > notas.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Glosa ${{ steps.meta.outputs.version }}
          body_path: notas.md
          files: dist/*
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.borrador }}
          make_latest: true
